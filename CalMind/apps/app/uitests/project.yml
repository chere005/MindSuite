# The native notes-keyboard regression (#126). Not part of the app: a tiny
# host app plus a UI-testing bundle that drives the REAL CalMind app on a
# simulator by bundle id. Generated by xcodegen and run by
# tools/notes-keyboard-regression.sh — the .xcodeproj is gitignored.
name: NotesKeyboardProbe
options:
  bundleIdPrefix: com.seancheren.calmind.probe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_VERSION: "5.0"
targets:
  ProbeHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
  NotesKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NotesKeyboardUITests]
    dependencies:
      - target: ProbeHost
    settings:
      base:
        TEST_TARGET_NAME: ProbeHost
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  NotesKeyboardUITests:
    build:
      targets:
        NotesKeyboardUITests: [test]
    test:
      targets: [NotesKeyboardUITests]
