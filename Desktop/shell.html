<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'">
<title>MindSuite</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="picker.css">
<script src="picker.js" defer></script>
<script src="shell.js" defer></script>
</head>
<body>
<header>
  <div class="primary-tools">
    <img src="assets/icon.png" width="24" height="24" alt="MindSuite">
    <nav aria-label="MindSuite apps" role="tablist"></nav>
  </div>
  <div class="secondary-tools">
  <nav class="pane-tools" aria-label="Right pane apps" hidden></nav>
  <button type="button" id="split" aria-label="Split view" title="Split view" aria-pressed="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M8 3v10"/></svg>
  </button>
  <button type="button" id="external" aria-label="Open in browser" title="Open in browser">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>
  </button>
  <button type="button" id="options" aria-label="App picker options" title="App picker options">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5" cy="4" r="1.4" fill="var(--bar)"/><circle cx="10" cy="8" r="1.4" fill="var(--bar)"/><circle cx="6" cy="12" r="1.4" fill="var(--bar)"/></svg>
  </button>
  </div>
</header>
<main aria-live="polite">
  <section id="left"></section>
  <div id="divider" role="separator" tabindex="0" aria-label="Resize split panes" title="Drag to resize. Double-click to reset."
       aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" hidden></div>
  <section id="right" hidden></section>
</main>
<dialog class="ms-picker-options" id="options-dialog" aria-labelledby="options-title">
  <h2 id="options-title">Edit app picker</h2>
  <ol data-picker-rows></ol>
  <footer>
    <button type="button" data-picker-add>Add spacer</button>
    <button type="button" data-picker-cancel>Cancel</button>
    <button type="button" data-picker-save>Save</button>
  </footer>
</dialog>
</body>
</html>
