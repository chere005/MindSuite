[package]
name = "acctmind-desktop"
version = "1.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
# Every target: tauri::generate_context!() expands the plugins block of tauri.conf.json into code that names serde_json.
serde_json = "1"

# The shared updater (src/updater.rs, a byte copy of CalMind's): macOS and Windows only, driven by the menu item alone.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-dialog = "2"
semver = "1"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[profile.release]
strip = true
