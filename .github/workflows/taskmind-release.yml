# Releases TaskMind's native shells on ONE GitHub Release: the signed, notarized Apple-silicon dmg and the Windows installers
# (msi + nsis exe, x64). A pushed tag TaskMind/<version> (tools/dtp.sh tags it) or a manual run naming an existing tag runs:
#
#   prepare  (ubuntu)   the tag must equal the version in all FOUR files that carry it; a tag that is already a published
#                       release stops the run; notes use TaskMind/docs/releases/<version>.md (or a plain "TaskMind <version>")
#                       plus an Installing block; a DRAFT release "TaskMind <version>" is created (an earlier run's draft is reused).
#   windows  (windows)  cargo test of the shell, Tauri build (msi + nsis exe, x64), asset check, a real install and launch of
#                       the MSI; the two installers are uploaded into the draft.
#   macos    (macos-15) cargo test, then a Developer ID signed, notarized and stapled Apple-silicon dmg, verified before upload.
#   publish  (ubuntu)   every expected file is on the draft; SHA256SUMS.txt is added; the release is published (never marked Latest; a
#                       version containing "-" is a pre-release). A missing file leaves the release a DRAFT.
#
# THE UPDATE FEED IS NOT HERE. The auto-update archives and latest.json are signed with a key that lives only on the owner's
# Mac (never in GitHub), so tools/dtp.sh runs ../tools/publish-update.mjs AFTER this release is published. Nothing in this
# workflow signs or uploads update artifacts, and nothing may use releases/latest URLs (no app release is ever marked Latest).
#
# A failed build job leaves the release a draft nobody sees: fix it, then dispatch the workflow again for the tag
# (`gh workflow run taskmind-release.yml --ref TaskMind/<version> -f tag=TaskMind/<version>`; never `gh run rerun`).
# A published release is never rebuilt.
#
# NO actions/upload-artifact OR download-artifact ANYWHERE: the account's Actions artifact storage quota can be full, and
# release assets do not count against it. The build tool never uploads either: `gh release upload` does.
#
# PREFLIGHT (workflow_dispatch with preflight=true; tools/preflight.sh does it): the same builds on the commit about to be
# tagged, no release created, nothing uploaded; the run summary lists each job's result.
#
# QUIET CI (AgentSuite/ci.md; `python3 ../AgentSuite/tools/check-workflows.py .` checks it). GitHub mails a run's outcome
# to whoever TRIGGERED it. So a run a person starts (the tag push, `gh workflow run`, a re-run) only runs `handoff`, which
# re-dispatches this workflow as github-actions[bot] (GITHUB_TOKEN); the bot's run does the work, and nobody is mailed
# whatever happens to it. Every job is also `continue-on-error`, so even the bot's run stays green; the scripts read each job.
# A release run that ends with a platform missing re-dispatches itself (input `attempt`, at most 3 runs) and builds only
# the platforms whose files are not on the draft yet; after the third it leaves the draft for the lane to report.
#
# Windows installers are not Authenticode signed (the owner's decision); the Windows updater is protected by Tauri's own
# minisign signature plus HTTPS. The macOS app must be signed and notarized.
name: TaskMind Release

on:
  push:
    tags: ["TaskMind/[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, e.g. TaskMind/1.1.0. Optional in preflight mode: the version in the files is used."
        required: false
        type: string
      preflight:
        description: "Preflight: build everything, publish nothing, never fail the run"
        required: false
        default: false
        type: boolean
      attempt:
        description: "Set by the release itself when it retries a missing platform (1 = the first run)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  actions: read

# A person's run (handoff only) gets a group of its own: it must never queue behind, or be cancelled by, the bot's run.
concurrency:
  group: ${{ github.triggering_actor != 'github-actions[bot]' && format('handoff-{0}', github.run_id) || format('taskmind-{0}{1}', inputs.preflight && 'preflight-' || 'release-', inputs.tag || github.sha) }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  # The tag as asked for: the pushed tag, or the dispatch input (blank is allowed only in preflight mode).
  REQ_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PREFLIGHT: ${{ inputs.preflight == true && 'true' || 'false' }}

jobs:
  # A person's run does only this: hand the same work to the bot (see QUIET CI above). Identical in every workflow.
  handoff:
    name: Hand off to the bot
    if: github.triggering_actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      INPUTS: ${{ toJSON(inputs) }}
      # What a push hands over: a tag push releases that tag.
      PUSH_INPUTS: ${{ github.ref_type == 'tag' && format('{{"tag":"{0}"}}', github.ref_name) || '{}' }}
    steps:
      - name: Dispatch this workflow as github-actions[bot]
        shell: bash
        run: |
          set -euo pipefail
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then json="$INPUTS"; else json="$PUSH_INPUTS"; fi
          [ -n "$json" ] && [ "$json" != null ] || json='{}'
          json=$(jq -c 'with_entries(select(.value != null) | .value |= tostring)' <<< "$json")
          echo "dispatching $wf at $GITHUB_REF_NAME with $json"
          for i in 1 2 3 4 5; do
            if gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --json <<< "$json"; then
              echo "### Handed off to github-actions[bot]" >> "$GITHUB_STEP_SUMMARY"
              echo "The work runs in the bot's run of $wf on $GITHUB_REF_NAME (Actions tab)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error title=Handoff failed::could not dispatch $wf; nothing was built"
          exit 1

  prepare:
    name: Tag, notes and the draft release
    if: github.triggering_actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      # A retry builds only what the draft still lacks ("true" = build it). Preflight builds everything.
      need_windows: ${{ steps.draft.outputs.need_windows || 'true' }}
      need_macos: ${{ steps.draft.outputs.need_macos || 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Preflight builds the commit the run was dispatched on (no tag exists yet); a release builds the tag.
          ref: ${{ inputs.preflight == true && github.sha || format('refs/tags/{0}', env.REQ_TAG) }}
          fetch-depth: 0

      - name: The tag is the app's version, in every file that carries it
        id: version
        shell: bash
        working-directory: TaskMind
        run: |
          set -euo pipefail
          v_app=$(node -p "require('./package.json').version")
          v_native=$(node -p "require('./native/package.json').version")
          v_tauri=$(node -p "require('./native/src-tauri/tauri.conf.json').version")
          v_cargo=$(grep -m1 '^version = ' native/src-tauri/Cargo.toml | sed 's/^version = "\(.*\)".*/\1/')
          echo "package.json                         $v_app"
          echo "native/package.json                  $v_native"
          echo "native/src-tauri/tauri.conf.json     $v_tauri"
          echo "native/src-tauri/Cargo.toml          $v_cargo"
          if [ "$v_app" != "$v_native" ] || [ "$v_app" != "$v_tauri" ] || [ "$v_app" != "$v_cargo" ]; then
            echo "::error title=Version files disagree::package.json=$v_app, native/package.json=$v_native, native/src-tauri/tauri.conf.json=$v_tauri, native/src-tauri/Cargo.toml=$v_cargo. All four must carry the same version."
            exit 1
          fi
          version="$v_app"
          pat='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$version" | grep -Eq "$pat"; then
            echo "::error title=Not a version::The version '$version' is not <major>.<minor>.<patch>[-pre]."
            exit 1
          fi
          tag="$REQ_TAG"
          if [ -z "$tag" ]; then
            if [ "$PREFLIGHT" = true ]; then
              tag="TaskMind/$version"
            else
              echo "::error title=No tag::A release run needs a tag (the dispatch input 'tag')."
              exit 1
            fi
          fi
          if [ "${tag#TaskMind/}" = "$tag" ] || ! printf '%s' "${tag#TaskMind/}" | grep -Eq "$pat"; then
            echo "::error title=Not a version tag::'$tag' is not <major>.<minor>.<patch>[-pre] (expected TaskMind/<version>)."
            exit 1
          fi
          if [ "$tag" != "TaskMind/$version" ]; then
            echo "::error title=Tag and version differ::The tag is $tag but package.json, native/package.json, native/src-tauri/tauri.conf.json and native/src-tauri/Cargo.toml say $version. Set all four, commit, and tag TaskMind/$version on that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing TaskMind $version from $tag (preflight: $PREFLIGHT)"

      - name: Release notes for the app version
        if: env.PREFLIGHT != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: TaskMind
        run: |
          set -euo pipefail
          notes_file="docs/releases/${VERSION}.md"
          if [ -f "$notes_file" ] && grep -q '[^[:space:]]' "$notes_file"; then
            notes=$(cat "$notes_file")
          else
            notes="TaskMind ${VERSION}"
          fi
          file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$notes" > "$file"
          sed "s/@V@/${VERSION}/g" >> "$file" <<'EOF'

          ### Installing

          TaskMind opens the private team task app at seancheren.com; signing in needs an account that is on the team.

          - **Windows** (`TaskMind_@V@_x64_en-US.msi`, or `TaskMind_@V@_x64-setup.exe`): the installers are not code-signed, so SmartScreen may say "Windows protected your PC". Choose More info, then Run anyway.
          - **macOS** (Apple silicon, `TaskMind_@V@_aarch64.dmg`): signed with Developer ID and notarized.

          Installed copies update themselves: choose Check for Updates in the app menu (macOS) or the Help menu (Windows). `SHA256SUMS.txt` has the checksum of every file.
          EOF
          cat "$file"

      - name: The draft release for the tag
        id: draft
        if: env.PREFLIGHT != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: TaskMind
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          title="TaskMind ${VERSION}"
          # Every release for this tag, drafts included (a draft is not reachable by releases/tags/<tag>). The tag passed the
          # version pattern above, so it is safe inside the filter.
          states=$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | .draft")
          published=$(printf '%s\n' "$states" | grep -c '^false$' || true)
          drafts=$(printf '%s\n' "$states" | grep -c '^true$' || true)
          if [ "$published" -gt 0 ]; then
            echo "::error title=Already released::${TAG} is a published release; it is never rebuilt. A new version needs a new tag."
            exit 1
          fi
          if [ "$drafts" -gt 1 ]; then
            echo "::error title=Two drafts::${drafts} draft releases are waiting for ${TAG}: delete all but one on the Releases page, then dispatch again."
            exit 1
          fi
          if [ "$drafts" -eq 1 ]; then
            echo "Reusing the draft release for ${TAG} (an earlier run's)"
            gh release edit "$TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$notes"
          fi
          # A retry (or a re-dispatch) builds only the platforms whose files are not on the draft yet.
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          has() { printf '%s\n' "$names" | grep -Eq "$1"; }
          v=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          if has "^TaskMind_${v}_x64.*\.msi$" && has "^TaskMind_${v}_x64.*-setup\.exe$"; then w=false; else w=true; fi
          if has "^TaskMind_${v}_aarch64\.dmg$"; then m=false; else m=true; fi
          echo "build: windows=$w macos=$m"
          { echo "need_windows=$w"; echo "need_macos=$m"; } >> "$GITHUB_OUTPUT"

  windows:
    name: Windows msi + exe
    needs: prepare
    if: needs.prepare.outputs.need_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # A preflight keeps going when prepare fails (its job is continue-on-error): stop here, loudly, instead of building blind.
      - name: Prepare must have succeeded
        shell: bash
        run: '[ -n "$VERSION" ] || { echo "::error::prepare did not produce a version"; exit 1; }'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.preflight == true && github.sha || format('refs/tags/{0}', needs.prepare.outputs.tag) }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TaskMind/native/package-lock.json
      # Pinned to a commit (a moved tag could run foreign code next to the signing identity); with a SHA the toolchain is named.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install deps
        working-directory: TaskMind/native
        run: npm ci

      # The shell's own tests: the navigation allowlist and the shared updater against a local fixture feed.
      - name: Test the shell
        run: cargo test --manifest-path TaskMind/native/src-tauri/Cargo.toml

      # No createUpdaterArtifacts: CI has no update key (it lives on the owner's Mac); the lane makes the update files.
      - name: Build the Windows bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: TaskMind/native
          args: --bundles msi,nsis

      # The runner IS a Windows machine with a desktop session: install the MSI the way a user's machine would, launch
      # what it installed, and require that it launches, survives eight seconds, and puts up a window titled TaskMind.
      - name: Smoke the MSI on the runner
        shell: pwsh
        working-directory: TaskMind
        run: |
          $msi = Get-ChildItem native/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI to smoke' }
          Write-Host "installing $($msi.Name)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA\Programs" -Recurse -Include TaskMind.exe,taskmind.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'the MSI reported success but installed no TaskMind binary' }
          Write-Host "launching $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "the installed app exited within 8 seconds (code $($app.ExitCode))" }
          # The window takes a beat to be titled; three looks over six seconds.
          $title = ''
          foreach ($i in 1..3) {
            $title = (Get-Process -Id $app.Id -ErrorAction SilentlyContinue).MainWindowTitle
            if ($title -like '*TaskMind*') { break }
            Start-Sleep -Seconds 2
          }
          if ($title -notlike '*TaskMind*') { throw "the app is running but shows no TaskMind window - got '$title'" }
          Write-Host "window up: '$title' - stopping it"
          Stop-Process -Id $app.Id

      - name: The files this job attaches
        id: files
        shell: bash
        working-directory: TaskMind
        run: |
          set -euo pipefail
          b=native/src-tauri/target/release/bundle
          shopt -s nullglob
          files=("$b"/msi/TaskMind_"${VERSION}"_x64*.msi "$b"/nsis/TaskMind_"${VERSION}"_x64*-setup.exe)
          ls -l "$b"/msi "$b"/nsis
          if [ "${#files[@]}" -ne 2 ]; then
            echo "::error title=Wrong files::expected TaskMind_${VERSION}_x64*.msi and TaskMind_${VERSION}_x64*-setup.exe, found ${#files[@]} matching file(s)"
            exit 1
          fi
          printf 'Will attach: %s\n' "${files[@]}"
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/attach.txt"

      # The digest of each installer as the build made it, in the run's log, which a release token cannot edit. The owner's
      # publish-update step signs the installers it downloads from the release only if their SHA-256 is printed here, so a
      # file swapped on the release after this job is never signed with the update key (tools/publish-update.sh).
      - name: Record the installers' digests
        shell: bash
        working-directory: TaskMind
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/attach.txt"
          for f in "${files[@]}"; do
            printf 'MINDSUITE-DIGEST sha256 %s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done

      - name: Upload into the draft release
        if: env.PREFLIGHT != 'true'
        shell: bash
        working-directory: TaskMind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/attach.txt"
          gh release upload "$TAG" "${files[@]}" --clobber

  macos:
    name: macOS dmg (Apple silicon)
    needs: prepare
    if: needs.prepare.outputs.need_macos == 'true'
    # macos-15 runners are Apple-silicon Macs: the dmg is arm64, nothing is built for Intel.
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Prepare must have succeeded
        shell: bash
        run: '[ -n "$VERSION" ] || { echo "::error::prepare did not produce a version"; exit 1; }'

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.preflight == true && github.sha || format('refs/tags/{0}', needs.prepare.outputs.tag) }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TaskMind/native/package-lock.json
      # Pinned to a commit (a moved tag could run foreign code next to the signing identity); with a SHA the toolchain is named.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install deps
        working-directory: TaskMind/native
        run: npm ci

      - name: Test the shell
        run: cargo test --manifest-path TaskMind/native/src-tauri/Cargo.toml

      # The identity is imported only now, after `npm ci` and `cargo test` (third-party install scripts and build.rs ran
      # without it in the keychain), and no step before it holds the release token either.
      - name: Import Developer ID signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/ci/macos-signing.sh

      # `--bundles dmg` is passed here only: tauri.conf.json's own bundle targets stay as they are (the local lane builds
      # the .app from them). Tauri signs the app with the hardened runtime and notarizes it inside the dmg.
      - name: Build the macOS dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: TaskMind/native
          args: --bundles dmg

      # A real disk image, holding an app whose executable is arm64.
      - name: Check the dmg
        working-directory: TaskMind
        run: |
          set -euo pipefail
          dmg=$(ls native/src-tauri/target/release/bundle/dmg/TaskMind_"${VERSION}"_aarch64.dmg)
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" > /dev/null
          trap 'hdiutil detach "$mnt" -force > /dev/null 2>&1 || true' EXIT
          app=$(ls -d "$mnt"/*.app | head -1)
          echo "app: $app"
          for f in "$app"/Contents/MacOS/*; do
            archs=$(lipo -archs "$f")
            echo "$f: $archs"
            [ "$archs" = "arm64" ] || { echo "::error::$f is '$archs', not arm64"; exit 1; }
          done

      - name: The files this job attaches
        working-directory: TaskMind
        run: |
          set -euo pipefail
          ls -l native/src-tauri/target/release/bundle/dmg
          dmg=native/src-tauri/target/release/bundle/dmg/TaskMind_"${VERSION}"_aarch64.dmg
          [ -f "$dmg" ] || { echo "::error::no $dmg"; exit 1; }
          echo "Will attach: $dmg"
          echo "$dmg" > "$RUNNER_TEMP/attach.txt"

      # Tauri notarizes the app inside the dmg; the dmg wrapper itself is notarized and stapled here, so Gatekeeper accepts the
      # download as it is. The next step refuses a dmg or app that is not signed, notarized, stapled and arm64.
      - name: Notarize and staple the dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash tools/ci/notarize-dmg.sh TaskMind/native/src-tauri/target/release/bundle/dmg/TaskMind_${VERSION}_aarch64.dmg

      - name: Verify signature and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/ci/verify-macos-dmg.sh TaskMind/native/src-tauri/target/release/bundle/dmg/TaskMind_${VERSION}_aarch64.dmg TaskMind

      - name: Upload into the draft release
        if: env.PREFLIGHT != 'true'
        working-directory: TaskMind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$(cat "$RUNNER_TEMP/attach.txt")" --clobber

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/mindsuite-signing.keychain-db" || true

  # always(): a build job a retry skipped (its files are already there) or one GitHub never gave a runner must not skip
  # this. A prepare that failed produced no version: nothing to publish, nothing worth retrying.
  publish:
    name: Every file is there; publish the release
    needs: [prepare, windows, macos]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' && inputs.preflight != true && needs.prepare.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
      MAX_ATTEMPTS: "3"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Every expected file is on the release
        id: files
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets:"; printf '  %s\n' $names
          missing=""
          want() { # want <glob> <what>
            local hit=""
            while IFS= read -r n; do
              # shellcheck disable=SC2053
              if [[ "$n" == $1 ]]; then hit=1; fi
            done <<< "$names"
            [ -n "$hit" ] || missing="$missing $2($1)"
          }
          want "TaskMind_${VERSION}_x64*.msi"        "Windows msi"
          want "TaskMind_${VERSION}_x64*-setup.exe"  "Windows exe"
          want "TaskMind_${VERSION}_aarch64.dmg"     "macOS dmg"
          if [ -n "$missing" ]; then
            echo "Missing:${missing}"
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # A platform is missing: dispatch this workflow again for the same tag (as the bot, so a retry mails nobody either);
      # its prepare builds only what is still missing. After MAX_ATTEMPTS runs the draft stays for the lane to report.
      - name: Retry what is missing
        if: steps.files.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            next=$((ATTEMPT + 1))
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f "tag=$TAG" -f "attempt=$next"
            echo "### Run $ATTEMPT of $MAX_ATTEMPTS left a platform missing; run $next builds it" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${TAG} is still missing a platform after ${MAX_ATTEMPTS} runs: it stays a draft" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Release incomplete::${TAG} is missing a platform after ${MAX_ATTEMPTS} runs; the release stays a draft."
            exit 1
          fi

      - name: Checksums
        if: steps.files.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets" --pattern '*'
          rm -f "$RUNNER_TEMP/assets/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/assets" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt")
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber

      - name: Publish
        if: steps.files.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
          gh release view "$TAG" --json url --jq .url

  # Preflight only: say how each job went in the run summary.
  summary:
    name: Preflight summary
    needs: [prepare, windows, macos]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' && inputs.preflight == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: List every job's result
        shell: bash
        run: |
          {
            echo "## Preflight"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            gh run view "${{ github.run_id }}" --json jobs \
              --jq '.jobs[] | select(.name != "Preflight summary") | "| \(.name) | \(.conclusion // .status) |"' || echo "| (could not read the jobs) | |"
            echo
            gh run view "${{ github.run_id }}" --json jobs \
              --jq '.jobs[] | .name as $j | .steps[]? | select(.conclusion == "failure") | "- failed: \($j) > \(.name)"' || true
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
